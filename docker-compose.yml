version: '3.8'

services:
  nlrk_reader-front:
    container_name: nlrk_reader-front
    image: shaisarov/nlrk_reader-front
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "81:80"
    environment:
      - NODE_ENV=production
    networks:
      - web_rabis_network
networks:
  web_rabis_network:
    external: true
